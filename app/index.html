<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JavaScript Everywhere — Assignments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@10..48,700;10..48,800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{
  --ground:#FAFAF7; --surface:#FFFFFF; --surface-2:#F1F1EC;
  --line:#DEDED6; --ink:#1B1F27; --ink-2:#4B5260; --ink-3:#787F8C;
  --amber:#B47C0A; --amber-solid:#E8B437; --teal:#1F7D71; --teal-wash:#DDF0EC;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#12161F; --surface:#191E29; --surface-2:#212736;
    --line:#2E3546; --ink:#E9ECF2; --ink-2:#A6AEBF; --ink-3:#798296;
    --amber:#E8B437; --teal:#4FC0AF; --teal-wash:#152A29;
  }
}
:root[data-theme="dark"]{
  --ground:#12161F; --surface:#191E29; --surface-2:#212736;
  --line:#2E3546; --ink:#E9ECF2; --ink-2:#A6AEBF; --ink-3:#798296;
  --amber:#E8B437; --teal:#4FC0AF; --teal-wash:#152A29;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"Public Sans",-apple-system,"Segoe UI",sans-serif;
  line-height:1.55;display:grid;place-items:center;min-height:100vh;padding:32px 20px;
}
.wrap{width:100%;max-width:560px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-size:30px;font-weight:800;
   letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.kicker{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;
        text-transform:uppercase;color:var(--amber);margin-bottom:12px}
p.lead{color:var(--ink-2);margin:0 0 28px}
.list{display:flex;flex-direction:column;gap:10px}
a.card{
  display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:15px 17px;transition:border-color .13s,transform .1s;
}
a.card:hover{border-color:var(--amber-solid);transform:translateY(-1px)}
a.card:focus-visible{outline:2px solid var(--amber-solid);outline-offset:2px}
.day{
  font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700;
  background:var(--surface-2);border:1px solid var(--line);border-radius:7px;
  padding:6px 9px;flex:none;color:var(--ink-3)
}
.t{font-weight:600;font-size:15px;line-height:1.3}
.s{font-size:12.5px;color:var(--ink-3)}
.grow{flex:1;min-width:0}
.open{font-size:13px;font-weight:600;color:var(--amber);flex:none}
.soon{opacity:.5;pointer-events:none}
footer{margin-top:26px;font-size:12.5px;color:var(--ink-3);text-align:center;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">JavaScript Everywhere</div>
  <h1>Assignments</h1>
  <p class="lead">Open your assignment, work through it, and submit. Your grade is recorded automatically.</p>

  <div class="list">
    <a class="card" href="day01-tracker.html">
      <span class="day">Day 01</span>
      <span class="grow">
        <span class="t">Dev Environment Setup</span><br>
        <span class="s">Track 1 · Session 1 · 5 tasks</span>
      </span>
      <span class="open">Open →</span>
    </a>

    <span class="card soon">
      <span class="day">Day 02</span>
      <span class="grow">
        <span class="t">JS Fundamentals</span><br>
        <span class="s">Opens after Session 2</span>
      </span>
    </span>
  </div>

  <footer>Use the email address you registered with.</footer>
</div>
</body>
</html>
